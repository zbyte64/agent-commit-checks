id = "commit-message-matches-diff"
title = "Commit messages describe the diff"
enabled = true
status = "advisory"
author = "user"
applies_to = ["**/*"]
inputs = ["diff", "message"]

[question]
type = "choice"
instructions = """Would someone who reads only these commit messages be misled about what the commits do?
The diff is the combined change of all the commits. Each message is a summary of its commit. The messages are accurate when together they name the main changes, even if they leave out work that supports them: tests, fixtures, docs, config or template updates, helper functions, refactors, renames, and small fixes needed to make the main change work. Do not list such omissions.
A later commit may revise or undo an earlier one, so an earlier message can describe work the combined diff no longer shows. That is not misleading.
Answer `incomplete` only when the diff also changes how the program behaves in a separate way (a feature, behavior change or fix that is not part of the described changes) and no message mentions it at all. Tests, docs and comments are never a separate change, even when they cover a different feature.
Answer `wrong` when a message describes changes that neither the diff nor a later commit accounts for, or when no message describes the main change.
If the diff is truncated, do not assume the hidden part contradicts the messages."""
labels = { accurate = "Name the main changes; anything left out supports them", incomplete = "Leave out a separate change the diff also makes", wrong = "Describe something the commits do not do" }

[verdict]
accurate = "pass"
incomplete = "block"
wrong = "block"

[grading]
terms = []
