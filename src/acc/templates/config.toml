# agent-commit-checks project config. Binary paths are per machine, so prefer
# absolute paths (hooks launched from VS Code may not see your shell PATH).
# `~` and environment variables such as `$HOME` are expanded, so the committed
# file does not need to name a user.

[backends.claude]
command = "__CLAUDE__"
model = "haiku"

[backends.omp]
command = "__OMP__"
model = "@decision"        # omp role alias: set modelRoles.decision in ~/.omp/agent/config.yml

[backends.local]
# A small decision model on this machine, served by llama.cpp's llama-server (see the
# README's "Local model" section). `acc init --local [cpu|gpu]` turns a local model on
# for every agent.
url = "http://127.0.0.1:8763"
model = "__LOCAL_MODEL__"  # Hugging Face GGUF repo:quant (or an Ollama tag)
device = "cpu"             # or "gpu", with a GPU build of llama-server (Vulkan, CUDA or ROCm)
server = "__LLAMA_SERVER__"  # started when nothing answers at url; "" if you run the server yourself

# Each agent uses its own CLI by default. Route an agent to a different backend,
# e.g. the fake backend in tests:
# [agents.claude]
# backend = "fake"

[run]
# backend = "local"        # every agent uses this backend instead of its own CLI
max_diff_chars = 12000
timeout_seconds = 90
parallel = 4
max_checks_per_call = 8
on_backend_error = "block" # warn | block
min_block_confidence = 0.7 # a block answered with lower confidence only warns
secret_scan = true
# exclude_globs = ["**/package-lock.json", "**/*.min.js"]

[grading]
sample_size = 20
min_sample = 10
max_block_rate = 0.10
max_unstable = 1
max_history = 500
