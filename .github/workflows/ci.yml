name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      # The CLI also runs under Node (through jiti), as it does inside pi.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx tsc -p .
      # Tests use the fake backend and throwaway repos; no claude, omp or pi login needed.
      - run: bun test
      - run: node bin/acc.mjs --help
      - run: bin/acc --help
