[project]
name = "agent-commit-checks"
version = "0.1.0"
description = "Model-backed checks on the commits a coding agent is about to push"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]

[project.scripts]
acc = "acc.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mcp>=2.3", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Explicit so newer ruff releases (whose defaults grow) don't change what CI enforces.
select = ["E", "F", "W"]
