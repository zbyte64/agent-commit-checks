id = "tests-cover-changes"
title = "Behavior changes come with tests"
enabled = true
status = "proposed"
author = "user"
scope = "range"
applies_to = ["src/**", "lib/**", "app/**"]
inputs = ["diff", "file_list"]

[question]
type = "score"
instructions = "How well do the pushed changes add or update tests for the behavior they change? Pure refactors, docs and config changes need no tests."
levels = ["Covered, or no tests needed", "Partly covered", "Behavior changes with no tests"]

[verdict]
warn_at = 1
block_at = 2

[grading]
terms = ["def ", "function ", "class "]
